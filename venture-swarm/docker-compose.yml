services:
  directory:
    build: .
    command: uvicorn registry.app:app --host 0.0.0.0 --port 8000
    stop_grace_period: 10s
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3

  orchestrator:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    stop_grace_period: 10s
    ports:
      - "8001:8001"
    depends_on:
      - directory
      - trend-agent
      - funding-agent
      - competitor-agent
      - market-gap-agent
      - risk-agent
    environment:
      - DIRECTORY_URL=http://directory:8000
      - ZYND_REGISTRY_URL=http://directory:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PREMIUM_PAYMENT_TOKEN=${PREMIUM_PAYMENT_TOKEN:-}
      - ORCHESTRATOR_SDK_WEBHOOK_PORT=9201
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3

  trend-agent:
    build: .
    command: uvicorn agents.trend_agent.agent:app --host 0.0.0.0 --port 8101
    stop_grace_period: 10s
    ports:
      - "8101:8101"
    depends_on:
      - directory
    environment:
      - DIRECTORY_URL=http://directory:8000
      - ZYND_REGISTRY_URL=http://directory:8000
      - SERVICE_URL=http://trend-agent:8101
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:

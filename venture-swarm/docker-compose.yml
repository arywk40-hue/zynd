services:
  directory:
    build: .
    command: uvicorn registry.app:app --host 0.0.0.0 --port 8000
    stop_grace_period: 10s
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ZNS_ROOT=${ZNS_ROOT:-zns01.zynd.ai}
      - ZNS_DEVELOPER_HANDLE=${ZNS_DEVELOPER_HANDLE:-venture-swarm}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3

  orchestrator:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    stop_grace_period: 10s
    ports:
      - "8001:8001"
    depends_on:
      - directory
      - trend-agent
      - funding-agent
      - competitor-agent
      - market-gap-agent
      - risk-agent
    volumes:
      - zynd-keys:/app/.keys
    environment:
      - DIRECTORY_URL=http://directory:8000
      - ZYND_REGISTRY_URL=http://directory:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ZNS_ROOT=${ZNS_ROOT:-zns01.zynd.ai}
      - ZNS_DEVELOPER_HANDLE=${ZNS_DEVELOPER_HANDLE:-venture-swarm}
      - X402_ENABLED=${X402_ENABLED:-false}
      - X402_NETWORK=${X402_NETWORK:-eip155:84532}
      - X402_NETWORK_NAME=${X402_NETWORK_NAME:-Base Sepolia}
      - X402_USDC_ASSET=${X402_USDC_ASSET:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}
      - X402_FACILITATOR_URL=${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      - X402_SYNC_FACILITATOR_ON_START=${X402_SYNC_FACILITATOR_ON_START:-true}
      - PREMIUM_PAYMENT_TOKEN=${PREMIUM_PAYMENT_TOKEN:-}
      - ORCHESTRATOR_SDK_WEBHOOK_PORT=9201
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3


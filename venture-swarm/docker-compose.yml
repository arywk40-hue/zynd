      - SERVICE_URL=http://funding-agent:8102
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PREMIUM_COST_USD=0.10
      - PREMIUM_REQUIRED=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8102/health', timeout=2).read()"]
